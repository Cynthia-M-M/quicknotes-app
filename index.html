<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
    <!-- Dark mode toggle -->
    <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
  </header>

  <main>
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">New note</label>
        <input type="text" id="note-input" placeholder="What do you want to remember?">
        
        <label for="note-category" class="sr-only">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        
        <button type="submit">Add Note</button>
      </form>
      
      <!-- Live Counters -->
      <div class="counter-container">
        <span id="char-count">0 / 200 characters</span>
        <span id="word-count">0 words</span>
      </div>
      
      <p id="error-message"></p>
    </section>

    <section>
      <div class="notes-header">
        <h2>Your notes</h2>
        <!-- Clear All Bonus Feature -->
        <button id="clear-all-btn">Clear All</button>
      </div>
      
      <label for="search-input" class="sr-only">Search</label>
      <input type="text" id="search-input" placeholder="Search notes...">
      
      <p id="note-count">You have no notes yet.</p>
      
      <ul id="notes-list">
        <!-- Notes will be injected here by script.js -->
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built during Web Foundations.</p>
  </footer>
</body>
</html>
